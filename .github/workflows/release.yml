name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: ssh-agent-echo-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: ssh-agent-echo-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build binaries
        if: matrix.platform == 'linux'
        shell: bash
        run: bash ./build.sh linux

      - name: Package Linux binaries
        if: matrix.platform == 'linux'
        run: |
          cd .publish/linux
          tar -czf ../../ssh-agent-echo-linux-x64.tar.gz *

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./build.ps1 windows

      - name: Package Windows binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd .publish/windows
          Compress-Archive -Path * -DestinationPath ../../ssh-agent-echo-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binaries
          path: ${{ matrix.artifact }}

      - name: Upload artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-${{ matrix.platform }}-binaries
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux-binaries/ssh-agent-echo-linux-x64.tar.gz
            artifacts/windows-binaries/ssh-agent-echo-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
